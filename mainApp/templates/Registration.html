<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザー登録ページ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f0f2f5;
      }
      .container {
        width: 100%;
        max-width: 500px;
        margin: 50px auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
      }
      form {
        margin-top: 20px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-weight: bold;
      }
      input[type="text"],
      input[type="password"],
      input[type="email"],
      input[type="tel"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }
      input[type="submit"],
      input[type="button"] {
        width: 48%;
        padding: 10px 0;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      input[type="submit"] {
        background-color: #28a745;
        color: #fff;
      }
      input[type="submit"]:hover {
        background-color: #218838;
      }
      input[type="button"] {
        background-color: #6c757d;
        color: #fff;
      }
      input[type="button"]:hover {
        background-color: #5a6268;
      }
      .button-group {
        display: flex;
        justify-content: space-between;
      }
      .error-message {
        color: #d9534f;
        font-size: 14px;
        margin-bottom: 10px;
        display: none;
      }
    </style>
    <script>
      function validatePassword() {
        const passwordField = document.getElementById("id_password");
        const errorMessage = document.getElementById("password-error");
        const password = passwordField.value;

        // バリデーション条件
        const hasMinLength = password.length >= 8;
        const hasLetter = /[A-Za-z]/.test(password);
        const hasDigit = /\d/.test(password);
        const hasSpecialChar = /[@!_+]/.test(password);
        const isValidChar = /^[A-Za-z\d@!_+]+$/.test(password);

        // バリデーションチェック
        if (!hasMinLength) {
          errorMessage.textContent = "パスワードは8文字以上である必要があります。";
          errorMessage.style.display = "block";
          return false;
        }
        if (!hasLetter) {
          errorMessage.textContent = "パスワードには少なくとも1つの英字を含める必要があります。";
          errorMessage.style.display = "block";
          return false;
        }
        if (!hasDigit) {
          errorMessage.textContent = "パスワードには少なくとも1つの数字を含める必要があります。";
          errorMessage.style.display = "block";
          return false;
        }
        if (!hasSpecialChar) {
          errorMessage.textContent = "パスワードには @, !, _, + のいずれかの特殊文字を含める必要があります。";
          errorMessage.style.display = "block";
          return false;
        }
        if (!isValidChar) {
          errorMessage.textContent = "使用できない文字が含まれています。";
          errorMessage.style.display = "block";
          return false;
        }

        // 暗号化プロセス
        const encryptedPassword = CryptoJS.SHA256(password).toString();
        passwordField.value = encryptedPassword;

        errorMessage.style.display = "none";
        return true;
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1>ユーザー登録</h1>

      <form method="post" action="" onsubmit="return validatePassword()">
        {% csrf_token %}
        {{ form.as_p }}
        <span id="password-error" class="error-message"></span>
        <div class="button-group">
          <input type="submit" value="登録" />
          <input type="button" value="戻る" onclick="history.back()" />
        </div>
      </form>
    </div>
  </body>
</html>
