<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログインページ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #e9ecef;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 40px;
        max-width: 400px;
        width: 100%;
        text-align: center;
      }

      h1 {
        font-size: 24px;
        color: #333;
        margin-bottom: 20px;
        font-weight: bold;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      label {
        text-align: left;
        font-weight: bold;
        color: #555;
        margin-bottom: 5px;
      }

      input[type="text"],
      input[type="password"] {
        padding: 12px;
        font-size: 16px;
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        border-color: #007bff;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        outline: none;
      }

      button {
        padding: 12px;
        font-size: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #0056b3;
      }
      
      /* ログアウトメッセージ */
      .messages {
        list-style-type: none;
        padding: 0;
        margin: 20px 0;
      }
      .messages li {
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 5px;
        font-size: 16px;
        text-align: center;
        color: #155724; /* テキストカラーを設定 */
        background-color: #d4edda; /* 背景色を設定 */
        border: 1px solid #c3e6cb; /* 枠線を設定 */
      }

      #message p {
        background-color: #f8d7da;
        color: #721c24;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 20px;
      }

      a {
        color: #007bff;
        text-decoration: none;
        margin-top: 15px;
        font-size: 14px;
        display: block;
      }

      a:hover {
        text-decoration: underline;
      }

      .forgot-password {
        color: #6c757d;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
        padding: 5px;
        border-radius: 5px;
      }

      .forgot-password:hover {
        background-color: #f8d7da;
        color: #721c24;
      }

      footer {
        margin-top: 20px;
        font-size: 14px;
        color: #6c757d;
      }
    </style>
    <script>
      function encryptPassword() {
      const passwordField = document.getElementById("id_password");
      if (passwordField.value) {
        const encryptedPassword = CryptoJS.SHA256(passwordField.value).toString();
        passwordField.value = encryptedPassword;
        }
      }

      function showForgotPasswordPopup() {
        alert("パスワードを忘れた場合は、上長へ連絡してください。");
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1>ログイン</h1>
      <div id="message">
        {% if messages %}
        <ul class="messages">
          {% for message in messages %}
          <li class="{{ message.tags }}">
            {{ message }}
          </li>
          {% endfor %}
        </ul>
        {% endif %}        
      </div>
      <form method="post" action="" onsubmit="encryptPassword()">
        {% csrf_token %}
        <label for="id_user_id">ID:</label>
        <input
          type="text"
          name="user_id"
          id="id_user_id"
          placeholder="ユーザーID(e-mail)を入力してください"
          required
        />
        <label for="id_password">パスワード:</label>
        <input
          type="password"
          name="password"
          id="id_password"
          placeholder="パスワードを入力してください"
          required
        />
        <button type="submit">ログイン</button>
      </form>
      <a href="{% url 'registerPage' %}">新規社員アカウント登録</a>
      <p class="forgot-password" onclick="showForgotPasswordPopup()">パスワードをお忘れですか？</p>
      <footer>&copy; 2024 勤怠管理システム</footer>
    </div>
  </body>
</html>
